<style>

*{box-sizing:border-box}

.view{position:absolute;inset:0;display:flex;flex-direction:column;visibility:hidden;opacity:0;pointer-events:none;transform:translate3d(0,18px,0) scale(.985);transition:opacity .42s cubic-bezier(.22,1,.36,1),transform .52s cubic-bezier(.22,1,.36,1),visibility 0s linear .52s}.view.on{visibility:visible;opacity:1;pointer-events:auto;transform:translate3d(0,0,0) scale(1);transition-delay:0s}.view.leaving{visibility:visible;opacity:0;pointer-events:none;transform:translate3d(0,-10px,0) scale(.992);transition-delay:0s}.view.enter-left{transform:translate3d(-28px,0,0) scale(.985)}.view.enter-left.on{transform:translate3d(0,0,0) scale(1)}.view.enter-right{transform:translate3d(28px,0,0) scale(.985)}.view.enter-right.on{transform:translate3d(0,0,0) scale(1)}
/* 재생 화면 */
#vPlay{align-items:center;justify-content:flex-start;padding:0 28px 16px;text-align:center;position:relative;isolation:isolate;overflow:hidden;background:var(--bg)}
#vPlay .cover{margin-top:max(72px,calc((100% - min(78%,340px))/2 + 12px));flex:0 0 auto}

#vPlay>*{position:relative;z-index:1}

.cover{position:relative;width:min(78%,340px);aspect-ratio:1;border-radius:30px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;box-shadow:0 20px 40px -18px var(--ac)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover svg{width:25%;height:25%;opacity:.9}
.mt{margin-top:22px;width:100%;transition:opacity .18s,transform .22s}.track-change .cover{animation:coverIn .5s cubic-bezier(.22,1,.36,1)}.track-change .mt{animation:metaIn .42s cubic-bezier(.22,1,.36,1)}@keyframes coverIn{0%{opacity:.72;transform:scale(.965)}55%{opacity:1;transform:scale(1.008)}100%{opacity:1;transform:scale(1)}}@keyframes metaIn{0%{opacity:.35;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.mt h2{margin:0;font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.titleTicker{display:block;overflow:hidden;white-space:nowrap}
.titleTickerTrack{display:inline-flex;align-items:center;gap:42px;min-width:max-content;animation:titleFlow 12s linear infinite}
.titleTickerTrack span{display:inline-block}
@keyframes titleFlow{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.mt p{margin:13px 0 0;color:var(--sub);font-size:15px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45}
.nowLyric{width:92%;height:auto;min-height:60px;flex:1 1 auto;margin:24px auto 0;padding:0 4px;color:var(--text);font-size:14px;font-weight:600;line-height:1.45;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;text-align:center;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(8px);transition:opacity .22s,transform .22s}.nowLyric.show{opacity:1;transform:translateY(0)}
/* 가사 */

#lines{flex:1;overflow-y:auto;position:relative;padding:35% 22px;text-align:center;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}

/* 목록 */
#vList{overflow-y:auto}
.head{display:flex;align-items:center;gap:7px;padding:16px 16px 8px;flex-wrap:nowrap;position:relative;min-height:58px}

.row:active{background:var(--hv)}
.row.act{background:var(--hv)}.row.act .t{color:var(--ac)}
.th{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.th img{width:100%;height:100%;object-fit:cover}
.info{min-width:0}
.t{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--sub);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12.5px}
.chip{font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--hv);color:var(--ac);font-weight:700}
.x{width:32px;height:32px;color:var(--sub);font-size:15px}
.empty{margin:30px 16px;padding:50px 20px;text-align:center;color:var(--sub);border:2px dashed var(--line);border-radius:18px;line-height:1.6}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.note{font-size:12px;color:var(--sub);padding:14px 18px 20px;line-height:1.6}
/* 컨트롤 */
.ctl{padding:6px 22px 4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:999px;background:linear-gradient(to right,var(--ac) 0%,var(--ac) var(--p,0%),var(--line) var(--p,0%),var(--line) 100%);outline:none;margin:12px 0 6px;cursor:pointer;touch-action:pan-y;transition:background 80ms linear}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:999px;background:transparent}

.times{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}

.ib{width:46px;height:46px;border-radius:50%;transition:transform .16s,color .18s,background .18s}color:var(--sub);position:relative}
.ib.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,var(--bg));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 20%,transparent)}.ib.on:active{background:color-mix(in srgb,var(--ac) 20%,var(--bg))}

nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card)}

#searchWrap{padding:4px 16px 8px;position:sticky;top:0;z-index:2;background:var(--bg)}#search{width:100%;height:42px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);padding:0 16px;font:inherit;outline:none}#search:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 14%,transparent)}
.playTop{position:absolute;inset:0 0 auto 0;height:66px;display:block;z-index:6;pointer-events:none}.playTop .roundMini{position:absolute;top:14px;pointer-events:auto;width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.06);font-size:16px}.playTop .roundMini:nth-child(1){right:68px}.playTop .roundMini:nth-child(2){right:18px}.playTop .roundMini:nth-child(3){left:18px}.editMini{position:absolute;right:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:13px;z-index:2}.mt{position:relative}.infoBox{background:var(--card);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));color:var(--text)}#infoSheet{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:flex-end;justify-content:center;z-index:12}#infoSheet h3{margin:0 0 14px;font-size:19px}#infoSheet .detailCover{width:88px;height:88px;border-radius:20px;object-fit:cover;float:left;margin:0 14px 12px 0}#infoSheet p{line-height:1.6;color:var(--sub);font-size:14px;white-space:pre-wrap}#infoSheet .btn{margin-top:10px}
#statsPanel{margin:8px 16px 12px;padding:14px 16px;border:1px solid var(--line);border-radius:20px;background:var(--card)}#statsPanel b{font-size:14px}#statsPanel .statValue{font-size:23px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){.view,.cover,.mt,.row,.ib,.chipb{transition:none!important;animation:none!important}}
/* iPhone Safari 파일 선택기: display:none/hidden 대신 시각적으로만 숨김 */

}

/* Muse minimal rounded UI polish */

.view.on{will-change:transform,opacity}.cover,.mt,.nowLyric,.row,.ib,.chipb,.toolBtn,.roundMini{will-change:transform,opacity}.cover{transition:transform .48s cubic-bezier(.22,1,.36,1),opacity .36s ease,box-shadow .45s ease}.track-change .cover{animation:coverIn .62s cubic-bezier(.22,1,.36,1)}.track-change .mt{animation:metaIn .5s cubic-bezier(.22,1,.36,1)}.track-change .nowLyric{animation:lyricIn .48s cubic-bezier(.22,1,.36,1)}@keyframes lyricIn{0%{opacity:0;transform:translateY(12px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}.mt{transition:opacity .32s cubic-bezier(.22,1,.36,1),transform .42s cubic-bezier(.22,1,.36,1)}.nowLyric{transition:opacity .3s cubic-bezier(.22,1,.36,1),transform .42s cubic-bezier(.22,1,.36,1)}.row{transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .24s ease,background .2s ease}.ib,.toolBtn,.roundMini,.chipb{transition:transform .2s cubic-bezier(.22,1,.36,1),background .2s ease,color .2s ease,box-shadow .25s ease}

<script>
const $=s=>document.querySelector(s),au=$('#au'),seek=$('#seek');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOTE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const fmt=s=>{if(!isFinite(s)||s<=0)return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const bn=n=>n.replace(/\.[^.]+$/,'');
let tracks=[],cur=null,shuffle=false,repeat=0,played=new Set(),hist=[],uid=0,seeking=false,lock=0,activeIdx=-1;
const PLAYER_STATE_KEY='MusePlayerStateV2', ORDER_KEY='MuseTrackOrderV2', THEME_KEY='MuseThemeV1';
let pendingRestoreTime=null,lastStateWrite=0,lastStatsMediaTime=null,lastStatsSave=0;
function getPlayerState(){try{return JSON.parse(localStorage.getItem(PLAYER_STATE_KEY)||'{}')}catch(e){return {}}}
function savePlayerState(force=false){const now=Date.now();if(!force&&now-lastStateWrite<2500)return;lastStateWrite=now;try{localStorage.setItem(PLAYER_STATE_KEY,JSON.stringify({key:cur?.key||null,time:cur&&au.src?Math.max(0,au.currentTime||0):0,wasPlaying:!!cur&&!au.paused,updatedAt:now}))}catch(e){}}

const STATS_KEY='MuseDailyListeningV1';
function localDay(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function getStats(){try{return JSON.parse(localStorage.getItem(STATS_KEY)||'{}')}catch(e){return {}}}
function saveStats(s){try{localStorage.setItem(STATS_KEY,JSON.stringify(s))}catch(e){}}
function addListeningSeconds(sec){if(!Number.isFinite(sec)||sec<=0||sec>8)return;const s=getStats(),day=localDay();s[day]=Math.max(0,Number(s[day])||0)+sec;saveStats(s);if(Date.now()-lastStatsSave>5000){lastStatsSave=Date.now();renderStats()}}
function prettyTime(sec){sec=Math.floor(Math.max(0,sec||0));if(sec<60)return `${sec}초`;const m=Math.floor(sec/60);return m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`}
function renderStats(){const s=getStats(),today=s[localDay()]||0;let week=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);week+=Number(s[localDay(d)])||0}$('#todayTime').textContent=prettyTime(today);$('#weekTime').textContent=`최근 7일 · ${prettyTime(week)}`}

function saveOrder(){try{localStorage.setItem(ORDER_KEY,JSON.stringify(tracks.map(t=>t.key)))}catch(e){}}
const ACCENT_KEY='MuseAccentV1';
const ACCENTS=['#1976d2','#7c4dff','#e91e63','#009688','#ff6d00','#2e7d32','#c62828','#6d4c41','#00838f','#455a64'];
function hexToRgb(hex){const h=hex.replace('#','');return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}}
function applyAccent(color,save=true){if(!/^#[0-9a-f]{6}$/i.test(color))return;const root=document.documentElement;root.style.setProperty('--ac',color);root.style.setProperty('--ac2',color);root.style.setProperty('--hv',`color-mix(in srgb, ${color} 10%, var(--bg))`);$('#accentColor').value=color;document.querySelectorAll('.colorPreset').forEach(b=>b.classList.toggle('selected',b.dataset.color.toLowerCase()===color.toLowerCase()));if(save)try{localStorage.setItem(ACCENT_KEY,color)}catch(e){}}
function initAccent(){let c='';try{c=localStorage.getItem(ACCENT_KEY)||''}catch(e){}if(!/^#[0-9a-f]{6}$/i.test(c))c='#1976d2';applyAccent(c,false)}
function buildAccentSettings(){const box=$('#colorPresets');box.innerHTML=ACCENTS.map(c=>`<button type="button" class="colorPreset" data-color="${c}" style="--swatch:${c}" aria-label="${c}"></button>`).join('');box.querySelectorAll('.colorPreset').forEach(b=>b.addEventListener('click',()=>applyAccent(b.dataset.color)));let current='';try{current=localStorage.getItem(ACCENT_KEY)||''}catch(e){}if(!/^#[0-9a-f]{6}$/i.test(current))current='#1976d2';$('#accentColor').value=current;box.querySelectorAll('.colorPreset').forEach(b=>b.classList.toggle('selected',b.dataset.color.toLowerCase()===current.toLowerCase()))}
$('#bSettings').addEventListener('click',()=>{$('#colorSheet').hidden=false;});
$('#colorClose').addEventListener('click',()=>{$('#colorSheet').hidden=true;});
$('#colorSheet').addEventListener('click',e=>{if(e.target.id==='colorSheet')e.currentTarget.hidden=true});
$('#accentColor').addEventListener('input',e=>applyAccent(e.target.value));

const ALBUM_BG_KEY='MuseAlbumBgAutoV1';

/* ---------- 새로고침 후에도 음악 유지: IndexedDB ---------- */
const DB_NAME='MuseLocalMusic',DB_VERSION=1,STORE='tracks';
let dbPromise=null;
function openDB(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){reject(new Error('이 브라우저에서 IndexedDB를 사용할 수 없습니다.'));return}
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'key'});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('IndexedDB 열기 실패'));
  });
  return dbPromise;
}
async function dbPut(record){
  const db=await openDB();
  await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('저장 실패'))});
}
async function dbDelete(key){
  try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});}catch(e){}
}
async function dbAll(){
  const db=await openDB();
  return await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)});
}
const fileKey=(f)=>[f.name||'',f.size||0,f.lastModified||0].join('|');
function safeFile(blob,name,type,lastModified){
  try{return new File([blob],name,{type:type||blob.type||'audio/mpeg',lastModified:lastModified||Date.now()})}
  catch(e){blob.name=name;blob.lastModified=lastModified||Date.now();return blob}
}

    key:t.key,name:t.file.name,size:t.file.size,lastModified:t.file.lastModified||0,type:t.file.type||'audio/mpeg',blob:t.file instanceof Blob?t.file: new Blob([t.file]),
    title:t.title||'',artist:t.artist||'',album:t.album||'',releaseDate:t.releaseDate||'',dur:t.dur||0,coverBlob:t.coverBlob,coverSource:t.coverSource||'',tag:t.tag||{},ai:!!t.ai,ly:t.ly||null,recognized:t.recognized||false,confidence:Number(t.confidence||0),verifyCount:Number(t.verifyCount||0),lookupSources:t.lookupSources||{},lastLookupStatus:t.lastLookupStatus||'',lookupAttempts:Number(t.lookupAttempts||0),manualMeta:!!t.manualMeta,updatedAt:Date.now()

/* ---------- 가사 파싱 ---------- */
function parseLRC(s){
  if(!s||!s.trim())return null;
  const rows=s.split(/\r\n|\r|\n/),syn=[],pl=[];let off=0;
  for(const raw of rows){
    const l=raw.trim();
    const mo=l.match(/^\[offset:\s*(-?\d+)\s*\]/i);if(mo){off=+mo[1]/1000;continue}
    if(/^\[[a-z]{2,}:[^\]]*\]$/i.test(l))continue;
    const ts=[...l.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
    const text=l.replace(/\[[^\]]*\]|<\d+:[^>]*>/g,'').trim();
    if(ts.length)ts.forEach(m=>syn.push({t:Math.max(0,+m[1]*60+parseFloat(m[2].replace(':','.'))-off),text}));
    else pl.push(text);
  }
  if(syn.length>=2)return{type:'sync',lines:syn.sort((a,b)=>a.t-b.t)};
  const lines=pl.filter((x,i)=>x||(pl[i-1]));
  while(lines.length&&!lines[0])lines.shift();
  return lines.length?{type:'plain',lines}:null;
}
function toText(ly){

}

/* ---------- ID3 태그 (제목·아티스트·커버·내장 가사) ---------- */

const clean=s=>s.replace(/\0+$/g,'').replace(/\0/g,' / ').trim();

/* 앨범 커버를 항상 정사각형으로 정규화합니다. 비율이 다른 이미지는 중앙을 기준으로 크롭합니다. */
async function squareCoverBlob(blob,size=1024){
  if(!blob||!/^image\//.test(blob.type||''))return blob;
  try{
    const img=await createImageBitmap(blob),w=img.width,h=img.height;
    if(w===h){img.close?.();return blob;}
    const side=Math.min(w,h),sx=Math.floor((w-side)/2),sy=Math.floor((h-side)/2);
    const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;

async function readTags(file){

    const buf=new Uint8Array(await file.slice(0,3*1024*1024).arrayBuffer());

      while(p+hl<end){
        const id=String.fromCharCode(...buf.slice(p,p+il));if(!/^[A-Z0-9]+$/.test(id))break;

        if(ver===2)sz=(buf[p+3]<<16)|(buf[p+4]<<8)|buf[p+5];
        else if(ver===4)sz=((buf[p+4]&127)<<21)|((buf[p+5]&127)<<14)|((buf[p+6]&127)<<7)|(buf[p+7]&127);
        else sz=buf[p+4]*16777216+((buf[p+5]<<16)|(buf[p+6]<<8)|buf[p+7]);

const probe=url=>new Promise(r=>{const a=new Audio();a.preload='metadata';a.onloadedmetadata=()=>r(a.duration||0);a.onerror=()=>r(0);a.src=url});

/* ---------- 곡 추가 ---------- */
const AUDIO_EXT_RE=/\.(mp3|m4a|wav|aac|flac|ogg|oga|opus|aif|aiff|caf|wma)$/i;
function isAudioFile(f){
  if(!f||!f.name)return false;
  return (typeof f.type==='string'&&f.type.toLowerCase().startsWith('audio/'))||AUDIO_EXT_RE.test(f.name);
}
async function addFiles(fl){
  const arr=[...fl].filter(isAudioFile);
  if(!arr.length){toast('음악 파일을 선택해 주세요');return}
  const known=new Set(tracks.map(t=>t.key||fileKey(t.file)));
  const fresh=arr.filter(f=>!known.has(fileKey(f)));
  if(!fresh.length){toast('이미 추가된 음악이에요');return}

  for(const f of fresh){
    const key=fileKey(f),url=URL.createObjectURL(f),g=await readTags(f);
    const t={id:++uid,key,file:f,url,title:g.title||'',artist:g.artist||'',album:g.album||'',cover:g.cover||null,coverBlob:null,dur:0,tag:{title:g.title||'',artist:g.artist||'',album:g.album||''},ai:false,busy:true,ly:loadLy({file:f})||parseLRC(g.lyrics),recognized:false,lookupAttempts:0,manualMeta:false};
    tracks.push(t);render();
    t.dur=await probe(url);
    await persistSilently(t);
    render();
    // 태그/파일명을 바탕으로 MusicBrainz에서 제목·가수·앨범을 자동 보완하고, 커버를 가져옵니다.
    await resolveOnlineMetadata(t);
    t.busy=false;
    await persistSilently(t);
    render();showNow();
    await new Promise(r=>setTimeout(r,250));
  }
  saveOrder();
  toast(fresh.length+'곡을 추가했어요');
  if(!cur&&tracks.length)play(tracks[0],false);
}

// YouTube → MP3: 서버에서 변환한 오디오를 Blob으로 받아 Muse IndexedDB에 바로 넣습니다.
const ytSheet=$('#ytSheet'),ytUrl=$('#ytUrl'),ytStatus=$('#ytStatus');
$('#bYoutube').addEventListener('click',()=>{ytSheet.hidden=false;ytStatus.textContent='';setTimeout(()=>ytUrl.focus(),50)});
$('#ytClose').addEventListener('click',()=>{ytSheet.hidden=true});
ytSheet.addEventListener('click',e=>{if(e.target===ytSheet)ytSheet.hidden=true});
$('#ytStart').addEventListener('click',async()=>{
  const url=ytUrl.value.trim();
  if(!url){ytStatus.textContent='YouTube 링크를 입력해 주세요.';return}
  const btn=$('#ytStart');btn.disabled=true;ytStatus.textContent='YouTube에서 오디오를 준비하고 있어요…';
  try{
    const res=await fetch('/.netlify/functions/youtube-to-mp3',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    if(!res.ok){let msg='변환에 실패했어요.';try{const d=await res.json();if(d?.error)msg=d.error}catch(e){}throw Error(msg)}
    const blob=await res.blob();
    if(!blob.size)throw Error('빈 오디오가 반환됐어요.');
    const cd=res.headers.get('content-disposition')||'';
    const m=cd.match(/filename="?([^";]+)"?/i);
    const name=((m?.[1]||'YouTube Audio').replace(/[\\/:*?"<>|]/g,'_').replace(/\.mp3$/i,'')||'YouTube Audio')+'.mp3';
    const file=new File([blob],name,{type:'audio/mpeg'});
    ytStatus.textContent='Muse 음악 목록에 추가하고 있어요…';
    await addFiles([file]);
    ytSheet.hidden=true;ytUrl.value='';
  }catch(e){console.error(e);ytStatus.textContent=e?.message||'변환에 실패했어요. Netlify Functions가 배포되어 있는지 확인해 주세요.'}
  finally{btn.disabled=false}
});

/* ---------- 음악 정보 / 앨범 커버 자동 검색 ---------- */
let mbLast=0;
function waitForMusicBrainz(){return new Promise(resolve=>{const wait=Math.max(0,1050-(Date.now()-mbLast));setTimeout(()=>{mbLast=Date.now();resolve()},wait)})}
function filenameGuess(name){
  let base=bn(name).replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();
  base=base.replace(/^\d+[.)_-]\s*/,'').replace(/\s*\[[^\]]*\]\s*/g,' ').trim();
  let m=base.match(/^(.+?)\s+-\s+(.+)$/);
  return m?{artist:m[1].trim(),title:m[2].trim()}:{artist:'',title:base};
}
function cleanGuess(s){return String(s||'').replace(/\b(official|audio|video|lyrics?|mv|hd|remaster(?:ed)?|live)\b/gi,' ').replace(/\s+/g,' ').trim()}
function normMusic(v){return String(v||'').normalize('NFKD').toLowerCase().replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}]+/gu,'')}

  const x=normMusic(a),y=normMusic(b);if(!x||!y)return 0;if(x===y)return 1;
  if(x.includes(y)||y.includes(x))return Math.min(x.length,y.length)/Math.max(x.length,y.length);
  let same=0;const n=Math.min(x.length,y.length);for(let i=0;i<n;i++)if(x[i]===y[i])same++;
  return same/Math.max(x.length,y.length);
}
async function mbSearch(t){
  const g=filenameGuess(t.file.name);
  const qTitle=cleanGuess(t.title||g.title),qArtist=cleanGuess(t.artist||g.artist),qAlbum=cleanGuess(t.album||'');
  if(!qTitle&&!qArtist)return null;
  const level=Math.max(0,Number(t.lookupAttempts||0));
  const quote=v=>String(v||'').replace(/"/g,'').trim();
  const loose=v=>quote(v).replace(/[\[\]{}()]/g,' ').replace(/\s+/g,' ').trim();
  const queries=[];
  if(qTitle&&qArtist)queries.push(`recording:"${quote(qTitle)}" AND artistname:"${quote(qArtist)}"`);
  if(qTitle&&qAlbum)queries.push(`recording:"${quote(qTitle)}" AND release:"${quote(qAlbum)}"`);
  if(qTitle)queries.push(`recording:"${quote(qTitle)}"`);
  if(level>=1){
    if(qTitle&&qArtist)queries.push(`recording:${loose(qTitle)} AND artist:${loose(qArtist)}`);
    if(qTitle&&qArtist)queries.push(`artistname:${loose(qArtist)} AND recording:${loose(qTitle)}`);
    if(qTitle)queries.push(`recording:${loose(qTitle)}`);
  }
  if(level>=2){
    const parts=[qTitle,qArtist,qAlbum].filter(Boolean);
    if(parts.length)queries.push(parts.join(' '));
    if(qTitle)queries.push(`recording:${loose(qTitle)}`);
  }
  const byId=new Map();
  for(const query of [...new Set(queries)]){
    try{
      await waitForMusicBrainz();
      const limit=level>=2?50:level>=1?25:8;
      const res=await fetch('https://musicbrainz.org/ws/2/recording/?fmt=json&limit='+limit+'&inc=artists+releases&query='+encodeURIComponent(query),{headers:{Accept:'application/json'}});
      if(!res.ok)continue;
      const data=await res.json();
      for(const r of (data.recordings||[])){
        const candidate={id:r.id,title:r.title||'',artist:(r['artist-credit']||[]).map(x=>x.name||x.artist?.name||'').filter(Boolean).join(', '),length:r.length||0,releases:r.releases||[]};
        if(candidate.id)byId.set(candidate.id,candidate);
      }
    }catch(e){console.warn('MusicBrainz query failed',e)}
  }
  const candidates=[...byId.values()];if(!candidates.length)return null;
  const ranked=candidates.map(x=>{
    const ts=musicSimilarity(x.title,qTitle),as=qArtist?musicSimilarity(x.artist,qArtist):0;
    const dur=t.dur&&x.length?Math.max(0,1-Math.abs(x.length/1000-t.dur)/Math.max(8,t.dur*.12)):0;
    const album=qAlbum?(x.releases||[]).reduce((best,r)=>Math.max(best,musicSimilarity(r.title,qAlbum)),0):0;
    const score=(ts*.52)+(qArtist?as*.34:0)+(t.dur&&x.length?dur*.09:0)+(qAlbum?album*.05:0);
    const strongTitle=ts>=.94, strongArtist=!qArtist||as>=.88, durationOk=!t.dur||!x.length||Math.abs(x.length/1000-t.dur)<=Math.max(8,t.dur*.12);
    return {...x,score,strongTitle,strongArtist,durationOk,confidence:strongTitle&&strongArtist&&durationOk};
  }).sort((a,b)=>b.score-a.score);
  const best=ranked[0],runner=ranked[1];
  if(level===0){
    if(!best||!best.strongTitle||!best.strongArtist||!best.durationOk)return null;
    if(runner&&runner.score>.82&&best.score-runner.score<.025&&(!best.confidence||!runner.confidence))return null;
    return best;
  }
  const acceptable=ranked.find(x=>x.score>=.64&&(!qArtist||musicSimilarity(x.artist,qArtist)>=.65)&&(!t.dur||!x.length||Math.abs(x.length/1000-t.dur)<=Math.max(15,t.dur*.20)));
  return acceptable||null;
}

/* ---------- 무료 다중 카탈로그 교차검증 (Apple iTunes Search) ----------
   iTunes Search는 Apple의 공개 검색 API이며 음악/아티스트/앨범을 검색할 수 있습니다.
   브라우저에서는 JSONP 방식으로 호출해 CORS 의존성을 줄입니다. */
function itunesJsonp(url,timeout=9000){
  return new Promise((resolve,reject)=>{
    const cb='museItunes_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('iTunes timeout'))},timeout);
    function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}script.remove()}
    window[cb]=(data)=>{cleanup();resolve(data)};
    script.onerror=()=>{cleanup();reject(new Error('iTunes network error'))};
    script.src=url+'&callback='+encodeURIComponent(cb);
    document.head.appendChild(script);
  });
}
async function itunesSearch(t,candidate){
  const g=filenameGuess(t.file.name);
  const title=cleanGuess(candidate?.title||t.title||g.title);
  const artist=cleanGuess(candidate?.artist||t.artist||g.artist);
  if(!title&&!artist)return {checked:false,matched:false,rows:[]};
  const term=[artist,title].filter(Boolean).join(' ');
  try{
    const url='https://itunes.apple.com/search?media=music&entity=song&country=US&limit=20&term='+encodeURIComponent(term);
    const data=await itunesJsonp(url);
    const rows=Array.isArray(data?.results)?data.results:[];
    const ranked=rows.map(r=>{
      const ts=musicSimilarity(r.trackName||'',title);
      const as=artist?musicSimilarity(r.artistName||'',artist):0;
      const al=(t.album||candidate?.releases?.[0]?.title)?musicSimilarity(r.collectionName||'',t.album||candidate?.releases?.[0]?.title):0;
      const dur=t.dur&&r.trackTimeMillis?Math.max(0,1-Math.abs((r.trackTimeMillis/1000)-t.dur)/Math.max(8,t.dur*.12)):0;
      const score=ts*.55+as*.30+dur*.10+al*.05;
      return {raw:r,score,title:r.trackName||'',artist:r.artistName||'',album:r.collectionName||'',duration:(r.trackTimeMillis||0)/1000,artwork:r.artworkUrl100||''};
    }).sort((a,b)=>b.score-a.score);
    const best=ranked[0];
    if(!best)return {checked:true,matched:false,rows:[]};
    const matched=musicSimilarity(best.title,title)>=.94 && (!artist||musicSimilarity(best.artist,artist)>=.88) &&
      (!t.dur||!best.duration||Math.abs(best.duration-t.dur)<=Math.max(8,t.dur*.12));
    return {checked:true,matched,rows:ranked.slice(0,5),best};
  }catch(e){console.warn('iTunes search failed',e);return {checked:false,matched:false,rows:[]}}
}
function consensusScore(t,candidate,itunes,cross){
  const title=cleanGuess(t.title||filenameGuess(t.file.name).title);
  const artist=cleanGuess(t.artist||filenameGuess(t.file.name).artist);
  const titleScore=title?musicSimilarity(candidate.title,title):1;
  const artistScore=artist?musicSimilarity(candidate.artist,artist):1;
  const durScore=t.dur&&candidate.length?Math.max(0,1-Math.abs(candidate.length/1000-t.dur)/Math.max(8,t.dur*.12)):1;
  const lrclib=cross?.matched?1:0;
  const apple=itunes?.matched?1:0;
  // 실제 카탈로그 일치(Apple/LRCLIB)보다 파일명 문자열을 덜 신뢰합니다.
  const score=Math.round((titleScore*.16+artistScore*.16+durScore*.18+lrclib*.20+apple*.30)*100);
  return {score,titleScore,artistScore,durScore,lrclib,apple};
}

async function verifyWithLrclib(t,candidate){
  // LRCLIB은 MusicBrainz와 별개의 카탈로그입니다. 검색 결과와 실제 가사 레코드를 모두 확인합니다.
  try{
    const params=new URLSearchParams({track_name:candidate.title,artist_name:candidate.artist});
    if(candidate.releases?.[0]?.title)params.set('album_name',candidate.releases[0].title);
    const res=await fetch('https://lrclib.net/api/search?'+params.toString());
    if(!res.ok)return {checked:false,matched:false,rows:[]};
    const rows=await res.json();if(!Array.isArray(rows)||!rows.length)return {checked:true,matched:false,rows:[]};
    const close=rows.filter(r=>musicSimilarity(r.trackName,candidate.title)>=.94&&musicSimilarity(r.artistName,candidate.artist)>=.88&&(!t.dur||!r.duration||Math.abs(Number(r.duration)-t.dur)<=Math.max(8,t.dur*.12)));
    return {checked:true,matched:close.length>0,rows:close};
  }catch(e){return {checked:false,matched:false,rows:[]}}
}

async function verifyLyricsRecord(t, candidate){
  // 5중 검증의 핵심: 제목/가수/앨범/재생시간/LRC 존재를 독립적으로 확인합니다.
  try{
    const q=new URLSearchParams({track_name:candidate.title,artist_name:candidate.artist,duration:String(Math.max(1,Math.round(t.dur||0)))});
    const album=(candidate.releases||[]).map(r=>r.title).find(Boolean)||t.album||'';
    if(album)q.set('album_name',album);
    const res=await fetch('https://lrclib.net/api/get?'+q.toString());
    if(!res.ok)return {checked:false,matched:false,lyrics:''};
    const d=await res.json();
    const titleOk=musicSimilarity(d.trackName||'',candidate.title)>=.94;
    const artistOk=musicSimilarity(d.artistName||'',candidate.artist)>=.88;
    const albumOk=!album||!d.albumName||musicSimilarity(d.albumName,album)>=.82;
    const durationOk=!t.dur||!d.duration||Math.abs(Number(d.duration)-t.dur)<=Math.max(2,t.dur*.04);
    const lyrics=String(d.syncedLyrics||d.plainLyrics||'').trim();
    const lrcOk=!!d.syncedLyrics&&parseLRC(d.syncedLyrics)?.type==='sync';
    const score=[titleOk,artistOk,albumOk,durationOk,lrcOk].filter(Boolean).length;
    return {checked:true,matched:score>=4,score,lyrics:d.syncedLyrics||d.plainLyrics||'',data:d};
  }catch(e){return {checked:false,matched:false,lyrics:''}}
}

async function fiveStageVerification(t,candidate,mbDetail,cross,itunes){
  // 6중 검증: MusicBrainz 검색 / MusicBrainz 상세 / Apple 카탈로그 /
  // LRCLIB 검색 / LRCLIB 실제 레코드 / 파일 정보+재생시간.
  const stages=[];
  const title=cleanGuess(t.title||filenameGuess(t.file.name).title);
  const artist=cleanGuess(t.artist||filenameGuess(t.file.name).artist);
  stages.push(candidate.strongTitle&&candidate.strongArtist&&candidate.durationOk);
  const detailTitle=mbDetail?.title||'';
  const detailArtist=(mbDetail?.['artist-credit']||[]).map(x=>x.name||x.artist?.name||'').filter(Boolean).join(', ');
  stages.push(musicSimilarity(detailTitle,candidate.title)>=.94&&musicSimilarity(detailArtist,candidate.artist)>=.88);
  stages.push(!!itunes?.matched);
  stages.push(!!cross?.matched);
  const lyricCheck=await verifyLyricsRecord(t,candidate);
  stages.push(!!lyricCheck.matched);
  const filename=filenameGuess(t.file.name);
  const fileConsistency=(title?musicSimilarity(title,candidate.title)>=.82:true)&&
    (artist?musicSimilarity(artist,candidate.artist)>=.78:true)&&
    (!t.dur||!candidate.length||Math.abs(candidate.length/1000-t.dur)<=Math.max(8,t.dur*.12));
  stages.push(fileConsistency);
  const passed=stages.filter(Boolean).length;
  const consensus=consensusScore(t,candidate,itunes,cross);
  // 외부 카탈로그가 2곳 모두 확인되지 않은 상태에서는 문자열 유사도만으로 확정하지 않습니다.
  const independentHits=[!!cross?.matched,!!itunes?.matched,stages[0],stages[1],stages[5]].filter(Boolean).length;
  const ok=(passed>=3 && consensus.score>=55 && independentHits>=2)||(passed>=2 && consensus.score>=72 && (cross?.matched||itunes?.matched));
  return {passed,total:6,ok,lyricCheck,stages,consensus,itunes};
}
async function mbRecording(id){
  await waitForMusicBrainz();
  const res=await fetch('https://musicbrainz.org/ws/2/recording/'+encodeURIComponent(id)+'?fmt=json&inc=artists+releases+release-groups',{headers:{Accept:'application/json'}});
  if(!res.ok)throw new Error('MusicBrainz recording '+res.status);
  return res.json();
}
async function findCover(meta,recording,t){
  // 커버는 곡의 앨범명과 아티스트가 일치하는 발매본을 우선합니다.
  const wantedAlbum=cleanGuess(t.album||'');
  const wantedArtist=cleanGuess(t.artist||recording?.artist||'');
  const releases=[...(meta?.releases||recording?.releases||[])];
  const scored=releases.map(r=>{
    const albumScore=wantedAlbum?musicSimilarity(r.title||'',wantedAlbum):0;
    const credit=(r['artist-credit']||[]).map(x=>x.name||x.artist?.name||'').filter(Boolean).join(', ');
    const artistScore=wantedArtist&&credit?musicSimilarity(credit,wantedArtist):0;
    return {...r,_albumScore:albumScore,_artistScore:artistScore};
  }).filter(r=>!wantedAlbum||r._albumScore>=.82)
   .sort((a,b)=>(b._albumScore-a._albumScore)||(b._artistScore-a._artistScore));
  const urls=[];
  for(const r of scored){
    if(r.id)urls.push({url:'https://coverartarchive.org/release/'+encodeURIComponent(r.id)+'/front-500',score:r._albumScore});
  }
  const groups=[...new Set(scored.map(r=>r['release-group']?.id).filter(Boolean))];
  for(const id of groups)urls.push({url:'https://coverartarchive.org/release-group/'+encodeURIComponent(id)+'/front-500',score:1});
  // 앨범명이 제공되었는데 해당 앨범에 대한 커버가 없으면 다른 앨범의 이미지를 임의로 가져오지 않습니다.
  if(!wantedAlbum&&!urls.length){
    const fallbackGroup=(meta?.releases||[]).map(r=>r['release-group']?.id).find(Boolean);
    if(fallbackGroup)urls.push({url:'https://coverartarchive.org/release-group/'+encodeURIComponent(fallbackGroup)+'/front-500',score:0});
  }
  for(const item of urls){
    try{
      const res=await fetch(item.url,{cache:'force-cache'});
      if(!res.ok)continue;
      const blob=await res.blob();
      if(blob.size>1000&&/^image\//.test(blob.type||'image/jpeg')){const c=await squareCoverUrl(blob);return c;}
    }catch(e){}
  }
  // 기존 곡 정보에 연결된 발매본에 커버가 없으면, 앨범명+가수명으로 발매본을 다시 찾습니다.
  if(wantedAlbum&&wantedArtist){
    try{
      await waitForMusicBrainz();
      const query=`release:"${String(wantedAlbum).replace(/"/g,'')}" AND artistname:"${String(wantedArtist).replace(/"/g,'')}"`;
      const res=await fetch('https://musicbrainz.org/ws/2/release/?fmt=json&limit=8&inc=artist-credits+release-groups&query='+encodeURIComponent(query),{headers:{Accept:'application/json'}});
      if(res.ok){
        const data=await res.json();
        const candidates=(data.releases||[]).map(r=>({...r,_album:musicSimilarity(r.title||'',wantedAlbum),_artist:musicSimilarity((r['artist-credit']||[]).map(x=>x.name||x.artist?.name||'').filter(Boolean).join(', '),wantedArtist)})).filter(r=>r.id&&r._album>=.82&&r._artist>=.82).sort((a,b)=>(b._album+b._artist)-(a._album+a._artist));
        for(const r of candidates){
          try{const cover=await fetch('https://coverartarchive.org/release/'+encodeURIComponent(r.id)+'/front-500',{cache:'force-cache'});if(cover.ok){const blob=await cover.blob();if(blob.size>1000){const c=await squareCoverUrl(blob);return c}}}catch(e){}
          const rg=r['release-group']?.id;
          if(rg){try{const cover=await fetch('https://coverartarchive.org/release-group/'+encodeURIComponent(rg)+'/front-500',{cache:'force-cache'});if(cover.ok){const blob=await cover.blob();if(blob.size>1000){const c=await squareCoverUrl(blob);return c}}}catch(e){}}
        }
      }
    }catch(e){}
  }
  // 앨범명이 없는 경우에만 곡/가수 기준으로 발매본을 보완 검색합니다.
  if(!wantedAlbum&&wantedArtist&&recording?.title){
    try{
      await waitForMusicBrainz();
      const query=`recording:"${String(recording.title).replace(/"/g,'')}" AND artistname:"${String(wantedArtist).replace(/"/g,'')}"`;
      const res=await fetch('https://musicbrainz.org/ws/2/release/?fmt=json&limit=5&inc=artist-credits+release-groups&query='+encodeURIComponent(query),{headers:{Accept:'application/json'}});
      if(res.ok){const data=await res.json();for(const r of (data.releases||[])){
        const credit=(r['artist-credit']||[]).map(x=>x.name||x.artist?.name||'').filter(Boolean).join(', ');
        if(musicSimilarity(credit,wantedArtist)<.82||!r.id)continue;
        try{const cover=await fetch('https://coverartarchive.org/release/'+encodeURIComponent(r.id)+'/front-500',{cache:'force-cache'});if(cover.ok){const blob=await cover.blob();if(blob.size>1000){const c=await squareCoverUrl(blob);return c}}}catch(e){}
      }}
    }catch(e){}
  }
  return null;
}
async function broadLookup(t){
  const g=filenameGuess(t.file.name);
  const titleQ=cleanGuess(t.title||g.title),artistQ=cleanGuess(t.artist||g.artist);
  try{
    const qs=[];
    if(titleQ&&artistQ)qs.push(titleQ+' '+artistQ);
    if(titleQ)qs.push(titleQ);
    if(artistQ)qs.push(artistQ);
    for(const qv of [...new Set(qs)]){
      const r=await fetch('https://lrclib.net/api/search?q='+encodeURIComponent(qv));
      if(!r.ok)continue;const rows=await r.json();
      const hit=(Array.isArray(rows)?rows:[]).map(x=>({...x,_score:(musicSimilarity(x.trackName||'',titleQ)*.58)+(artistQ?musicSimilarity(x.artistName||'',artistQ)*.32:0)+(t.dur&&x.duration?Math.max(0,1-Math.abs(Number(x.duration)-t.dur)/Math.max(15,t.dur*.20))*.10:0)})).sort((a,b)=>b._score-a._score)[0];
      if(hit&&hit._score>=.62){
        if(!t.title&&hit.trackName)t.title=hit.trackName;
        if(!t.artist&&hit.artistName)t.artist=hit.artistName;
        if(!t.album&&hit.albumName)t.album=hit.albumName;
        if(!t.ly){const ly=parseLRC(hit.syncedLyrics||hit.plainLyrics||'');if(ly){t.ly=ly;saveLy(t)}}
        return true;
      }
    }
  }catch(e){}
  return false;
}

async function resolveOnlineMetadata(t){
  t.lookupAttempts=Number(t.lookupAttempts||0)+1;
  const g=filenameGuess(t.file.name);
  // 파일명은 검색어를 보완하는 용도로만 사용하고, 사용자가 직접 입력한 제목·가수·앨범을 우선합니다.
  if(!t.title&&g.title)t.title=cleanGuess(g.title);
  if(!t.artist&&g.artist)t.artist=cleanGuess(g.artist);
  try{
    const hit=await mbSearch(t);
    if(!hit){const broad=await broadLookup(t);t.lastLookupStatus=broad?'넓은 범위에서 정보를 보완했어요.':'아직 일치 정보를 찾지 못했어요. 정보 찾기를 다시 누르면 검색 범위를 더 넓혀볼게요.';return broad||!!t.ly}
    const cross=await verifyWithLrclib(t,hit);
    // Apple/iTunes를 독립 카탈로그로 추가해 MusicBrainz 결과를 다시 교차검증합니다.
    const itunes=await itunesSearch(t,hit);
    const meta=await mbRecording(hit.id);
    const a=(meta['artist-credit']||[]).map(x=>x.name||x.artist?.name||'').filter(Boolean).join(', ');
    const verifiedTitle=meta.title||hit.title,verifiedArtist=a||hit.artist;
    if(musicSimilarity(verifiedTitle,t.title)<.94||(t.artist&&musicSimilarity(verifiedArtist,t.artist)<.88)){
      t.lastLookupStatus='검색 후보가 입력 정보와 충분히 일치하지 않아 자동 변경하지 않았어요.';return false;
    }
    const verifiedCandidate={...hit,artist:verifiedArtist,title:verifiedTitle};
    const verification=await fiveStageVerification(t,verifiedCandidate,meta,cross,itunes);
    t.confidence=verification.consensus?.score||0;
    t.verifyCount=verification.passed;
    t.lookupSources={musicbrainz:true,lrclib:!!cross?.matched,itunes:!!itunes?.matched};
    if(!verification.ok){
      t.lastLookupStatus='추가 확인이 필요해요. 정보 찾기를 다시 누르면 더 넓은 범위에서 찾아볼게요.';
      if(!t.ly && verification.lyricCheck?.matched&&verification.lyricCheck.lyrics){const ly=parseLRC(verification.lyricCheck.lyrics);if(ly){t.ly=ly;saveLy(t)}}
      if(!(verification.stages?.[0]&&verification.stages?.[1])||!(cross?.matched||itunes?.matched))return !!t.ly;
    }
    t.title=verifiedTitle;
    t.artist=verifiedArtist;
    t.album=t.album||meta.releases?.map(r=>r.title).find(Boolean)||'';
    t.releaseDate=t.releaseDate||(meta.releases||[]).map(r=>r.date).filter(Boolean).sort()[0]||'';
    t.ai=true;t.recognized=true;t.verifyCount=verification.passed;
    t.lastLookupStatus='다중 출처로 곡 정보를 확인했어요.';
    if(!t.cover||t.coverSource==='online'){
      const c=await findCover(meta,hit,t);
      if(c){if(t.cover&&t.coverSource==='online'&&String(t.cover).startsWith('blob:'))URL.revokeObjectURL(t.cover);t.cover=c.url;t.coverBlob=c.blob;t.coverSource='online'}
      else if(t.coverSource==='online'){if(String(t.cover||'').startsWith('blob:'))URL.revokeObjectURL(t.cover);t.cover=null;t.coverBlob=null;t.coverSource=''}
    }
    // 검증 과정에서 확인한 LRCLIB 가사를 우선 사용하고, 실패 시 한 번 더 일반 조회합니다.
    if(!t.ly && verification.lyricCheck?.matched&&verification.lyricCheck.lyrics){const ly=parseLRC(verification.lyricCheck.lyrics);if(ly){t.ly=ly;saveLy(t)}}
    if(!t.ly) await autoLyrics(t);
    return !!t.ai||!!t.ly;
  }catch(e){console.warn('Muse metadata lookup failed',e);t.lastLookupStatus='정보 검색 중 오류가 발생했어요. 네트워크 연결 후 다시 시도해 주세요.';return false}
}
async function findBestLrc(t){
  if(!t||!t.dur)return null;
  const titleQ=cleanGuess(t.title||filenameGuess(t.file.name).title);
  const artistQ=cleanGuess(t.artist||filenameGuess(t.file.name).artist);
  if(!titleQ&&!artistQ)return null;
  const queries=[...new Set([
    [titleQ,artistQ].filter(Boolean).join(' '),
    titleQ,
    artistQ
  ].filter(Boolean))];
  let all=[];
  for(const q of queries){
    try{
      const res=await fetch('https://lrclib.net/api/search?q='+encodeURIComponent(q));
      if(!res.ok)continue;
      const rows=await res.json();
      if(Array.isArray(rows))all.push(...rows);
    }catch(e){}
  }
  const seen=new Set();
  const ranked=all.filter(x=>{
    const k=[x.id,x.trackName,x.artistName,x.duration].join('|');
    if(seen.has(k))return false;seen.add(k);return !!x.syncedLyrics;
  }).map(x=>{
    const ts=titleQ?musicSimilarity(x.trackName||'',titleQ):0;
    const as=artistQ?musicSimilarity(x.artistName||'',artistQ):0;
    const ds=x.duration?Math.max(0,1-Math.abs(Number(x.duration)-t.dur)/Math.max(3,t.dur*.04)):0;
    const al=t.album&&x.albumName?musicSimilarity(x.albumName,t.album):0;
    const exactDur=x.duration?Math.abs(Number(x.duration)-t.dur)<=Math.max(2.5,t.dur*.025):false;
    const score=ts*.42+as*.28+ds*.25+al*.05+(exactDur?.08:0);
    return {...x,_score:score,_durationDiff:x.duration?Math.abs(Number(x.duration)-t.dur):999};
  }).sort((a,b)=>b._score-a._score);
  const hit=ranked.find(x=>{
    const titleOk=!titleQ||musicSimilarity(x.trackName||'',titleQ)>=.90;
    const artistOk=!artistQ||musicSimilarity(x.artistName||'',artistQ)>=.84;
    const durOk=!x.duration||Math.abs(Number(x.duration)-t.dur)<=Math.max(5,t.dur*.08);
    return titleOk&&artistOk&&durOk;
  });
  if(!hit)return null;
  const ly=parseLRC(hit.syncedLyrics);
  if(!ly||ly.type!=='sync'||!ly.lines.length)return null;
  return {ly,hit,score:hit._score,durationDiff:hit._durationDiff};
}

async function autoLyrics(t){
  if(t.ly||!t.title||!t.artist||!t.dur)return;
  try{
    const q=new URLSearchParams({track_name:t.title,artist_name:t.artist,duration:String(Math.max(1,Math.round(t.dur)))});
    if(t.album)q.set('album_name',t.album);
    const res=await fetch('https://lrclib.net/api/get?'+q.toString());
    if(!res.ok)return;const data=await res.json();
    const text=data.syncedLyrics||data.plainLyrics||'';
    const ly=parseLRC(text);
    if(ly){t.ly=ly;saveLy(t)}
  }catch(e){}
}

function pickNext(){

function setupTitleTicker(el,text){
  if(!el)return;
  el.classList.remove('titleTicker','is-overflow');
  el.style.removeProperty('--ticker-distance');
  el.style.removeProperty('--ticker-duration');
  el.textContent=text||'';
  if(!text)return;

  // 실제 표시 영역과 제목 폭을 측정해서 필요한 경우에만 흐르게 합니다.
  const available=Math.max(0,el.clientWidth-2);
  const measure=document.createElement('span');
  measure.textContent=text;
  measure.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;line-height:inherit;';
  document.body.appendChild(measure);
  const textWidth=measure.getBoundingClientRect().width;
  measure.remove();
  if(textWidth<=available+2)return;

  const gap=46;
  el.classList.add('titleTicker','is-overflow');
  el.innerHTML=`<span class="titleTickerTrack"><span>${escapeHtml(text)}</span><span aria-hidden="true">${escapeHtml(text)}</span></span>`;
  const distance=textWidth+gap;
  // 짧은 제목은 빠르게, 아주 긴 제목은 조금 천천히. 시작/끝 정지 구간도 포함합니다.
  const duration=Math.max(8.5,Math.min(22,textWidth/31+4.2));
  el.style.setProperty('--ticker-distance',distance+'px');
  el.style.setProperty('--ticker-duration',duration+'s');
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

// 가사 다시 검색 / 가사 파일 업로드
async function refreshLyricsForCurrent(){
  if(!cur){toast('먼저 음악을 선택해 주세요');return}
  const t=cur;
  const oldLy=t.ly;
  t.ly=null; saveLy(t); renderLy(); setNowLyric(-1);
  toast('제목·가수·재생시간이 가장 가까운 LRC를 찾고 있어요…');
  try{
    const hit=await findBestLrc(t);
    if(hit){
      t.ly=hit.ly;
      t.lastLookupStatus=`재생시간 ${hit.durationDiff<1?'<1':Math.round(hit.durationDiff)}초 차이의 LRC를 선택했어요.`;
      saveLy(t);
      await persistSilently(t);
      renderLy(); showNow();
      toast('재생시간까지 맞는 LRC를 찾았어요');
      return;
    }
    // 정확한 LRC가 없을 때 기존의 다중 출처 검색을 한 번만 보조로 사용합니다.
    await resolveOnlineMetadata(t);
    if(t.ly){await persistSilently(t);toast('LRC를 찾았어요');renderLy();showNow()}
    else{t.ly=oldLy||null;if(t.ly)saveLy(t);renderLy();setNowLyric(-1);toast('재생시간이 맞는 LRC를 찾지 못했어요')}
  }catch(e){
    t.ly=oldLy||null;if(t.ly)saveLy(t);renderLy();setNowLyric(-1);toast('LRC 검색에 실패했어요')}
}
$('#bLyrSearch').addEventListener('click',refreshLyricsForCurrent);

// 앨범 커버에서 대표색을 뽑아 선택적으로 배경 팔레트를 조정합니다(외부 AI/API 없이 기기 안에서 처리).
const AUTO_VARS=['--bg','--card','--line','--hv','--ac','--ac2'];
function mixColor(a,b,ratio){const x=a.match(/[\da-f]{2}/gi).map(v=>parseInt(v,16)),y=b.match(/[\da-f]{2}/gi).map(v=>parseInt(v,16));return '#'+x.map((v,i)=>Math.round(v*(1-ratio)+y[i]*ratio).toString(16).padStart(2,'0')).join('')}
buildAccentSettings();initAccent();initTheme();initAlbumBgSetting();sync();render();renderLy();renderStats();restoreTracks();
</script>
